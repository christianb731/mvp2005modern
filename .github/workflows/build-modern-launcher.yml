name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply_production_rc1.py'
      - 'patches/apply_skip_intro_runtime_v3.py'
      - 'patches/apply_modern_launcher_v1.py'
      - 'patches/apply_modern_launcher_v2.py'
      - 'patches/apply_modern_launcher_v3.py'
      - 'patches/apply_controller_configurator_v4.py'
      - 'patches/apply_controller_configurator_v5.py'
      - 'patches/apply_controller_configurator_v6.py'
      - 'patches/apply_controller_configurator_v8.py'
      - 'patches/apply_controller_action_layout_v12.py'
      - 'patches/apply_controller_runtime_remap_v13.py'
      - 'patches/apply_controller_usability_v14.py'
      - 'patches/apply_controller_canonical_xbox_v15.py'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply RC1 runtime and Modern launcher
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          python3 ../patches/apply_controller_usability_v14.py
          python3 ../patches/apply_controller_canonical_xbox_v15.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern - All-in-One Launcher Preview v0.15

          Canonical Xbox controller state
          -------------------------------
          The user's v0.14 files confirmed that button calibration itself is
          correct: A/B/X/Y/LB/RB/View/Start/L3/R3 are physical DI indices 0-9.
          They also confirmed the Flydigi exposes LT as axis+3 and RT as axis-3.

          The remaining instability came from mixing those modern physical axis
          semantics with MVP's 2005-era Xbox profile. v0.15 now treats calibration
          as hardware input only and presents MVP with one canonical logical pad:

            A/B/X/Y       = logical buttons 1/2/3/4
            LB/RB         = logical buttons 5/6
            View/Start    = logical buttons 7/8
            L3/R3         = logical buttons 9/10
            LT            = canonical axis-3
            RT            = canonical axis+3

          The injected runtime normalizes BOTH buttons and trigger axis state before
          MVP reads it. On the tested Flydigi, the raw trigger axis is inverted at
          runtime so the game always sees the same trigger orientation as the
          long-established Xbox 360 controller.cfg profile.

          The generated baseball actions now follow that established profile:
            A/B/X/Y = home/first/third/second throws and pitches 1-4
            RB      = pitch 5 / retreat all / fake rundown
            LB      = fielder switch / advance all
            RT      = relay/cutoff throw
            L3      = pitch history
            R3      = bunt

          Faster tuning workflow:
            - Physical controller calibration should no longer require a new build.
            - Baseball action assignments live in controller.cfg and can be changed
              either in MVP's own My MVP > My MVP Options > Controller Config menu
              or through the launcher's Open controller.cfg button.
            - Future action-map tweaks should not require recompiling the launcher.

          Test procedure:
            1. Open Controller Setup and click Save to MVP once. Recalibration is
               not required because the uploaded v0.14 hardware values are valid.
            2. Launch a game.
            3. First verify B throws to first, X throws to third, and Start pauses.
            4. Then test LB/RB/L3/R3 and LT/RT in their relevant game contexts.

          Compatibility setup remains unchanged from the verified RC1 launcher path.
          Intro-video skipping remains disabled for now.
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.15-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.15-x86
          path: dist/
          if-no-files-found: error
