name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply_production_rc1.py'
      - 'patches/apply_skip_intro_runtime_v3.py'
      - 'patches/apply_modern_launcher_v1.py'
      - 'patches/apply_modern_launcher_v2.py'
      - 'patches/apply_modern_launcher_v3.py'
      - 'patches/apply_controller_configurator_v4.py'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply RC1 runtime and Modern launcher
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern - All-in-One Launcher Preview v0.4

          Goal: one launcher that prepares a normal user-owned MVP Baseball 2005
          installation for modern Windows without requiring SafeDiscShim or
          dgVoodoo2 to already be installed.

          Put MVP2005Modern.exe and mvp2005fix.dll together and run the launcher.
          It can live in the game directory or elsewhere. Select mvp2005.exe if it
          is not detected automatically.

          Compatibility setup
          -------------------
          On Launch, MVP2005 Modern verifies the complete compatibility stack:

          - SafeDiscShim v0.9.0
              If missing, the launcher downloads the official GitHub release,
              verifies SHA-256, and runs the official installer. Windows will show
              one UAC prompt because SafeDiscShim is a system-level compatibility
              component. SafeDiscShim preserves the original SafeDisc/media check.

          - dgVoodoo2 v2.87.5
              If the local wrapper is missing/incomplete, the launcher downloads
              the official GitHub release, verifies SHA-256, and installs the x86
              D3D8.dll, DDraw.dll and D3DImm.dll plus dgVoodoo.conf beside the game.
              Existing compatibility files are backed up before repair.

          - MVP2005 Modern RC1 runtime
              The included mvp2005fix.dll provides the verified resolution,
              widescreen, true-borderless, mouse-lifecycle and Alt-Tab fixes.

          Controller Setup
          ----------------
          v0.4 adds an integrated Controller Setup window. It enumerates connected
          DirectInput game controllers and derives the exact device/profile name
          MVP expects in Documents\MVP Baseball 2005\controller.cfg.

          It currently supports two generated layouts:
            - Xbox / XInput-style: 10 buttons, combined trigger axis, 5 axes
            - Generic DirectInput: 12 buttons, 4 axes

          A/B/X/Y (Cross/Circle/Square/Triangle), bumpers, Back/Start and stick-click
          button numbers are editable before saving. Stick axes, D-pad, triggers and
          the gameplay action bindings are generated from the selected layout.

          Saving creates/replaces only the selected controller profile while keeping
          the rest of an existing controller.cfg. The original controller.cfg is
          backed up once as controller.cfg.mvp2005modern.bak.

          Intro-video skipping has been removed from the visible v0.4 UI for now.
          It is low priority and will return only after we have a reliably tested
          implementation.

          The Setup / Repair button explicitly re-checks SafeDiscShim and refreshes
          the pinned dgVoodoo files while retaining backups.

          A genuinely clean Windows 10/11 machine is an intended supported setup.
          First-time automatic setup requires internet access and one UAC approval
          for SafeDiscShim. That clean-machine path still needs real-world testing.

          Pinned external downloads:
            SafeDiscShim v0.9.0 installer
              SHA-256 b4c355ec63047a09c20c286c083fcad1031d47a2c17eac0de12b96d377ec369f
            dgVoodoo2 v2.87.5 release ZIP
              SHA-256 5ffde6927f7355ca3fdd5d785b581256a8e6539fa13e395a891ade6ba1040850

          This artifact does not contain MVP Baseball 2005, EA/MLB assets,
          dgVoodoo2 binaries, SafeDiscShim binaries, or a no-CD executable.
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.4-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.4-x86
          path: dist/
          if-no-files-found: error
