name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern patch stack
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          python3 ../patches/apply_controller_usability_v14.py
          python3 ../patches/apply_controller_canonical_xbox_v15.py
          python3 ../patches/apply_controller_xinput_bridge_v16.py
          python3 ../patches/apply_controller_full_diagnostics_v17.py
          python3 ../patches/apply_controller_frontend_gameplay_split_v18.py
          python3 ../patches/apply_controller_x_quarantine_v19.py
          python3 ../patches/apply_controller_zero_based_profile_v20.py
          python3 ../patches/apply_controller_one_based_final_v21.py
          python3 ../patches/apply_controller_buffered_input_v22.py
          python3 ../patches/apply_controller_empirical_hybrid_v23.py
          python3 ../patches/apply_controller_empirical_rb_v24.py
          python3 ../patches/apply_controller_complete_gameplay_v25.py
          python3 ../patches/apply_controller_back_r2_alias_v26.py
          python3 ../patches/apply_controller_buttonized_modifiers_v27.py
          python3 ../patches/apply_controller_back_manager_macro_v28.py
          python3 ../patches/apply_controller_no_macro_cleanup_v29.py
          python3 ../patches/apply_controller_lt_field_switch_v30.py
          python3 ../patches/apply_controller_restore_native_fielding_v31.py
          python3 ../patches/apply_controller_live_learning_v32.py
          python3 ../patches/apply_setup_cleanup_v33.py
          python3 ../patches/apply_setup_cleanup_v33_fix.py
          python3 ../patches/apply_large_address_aware_v34.py
          python3 ../patches/apply_large_address_aware_v34_fix.py
          python3 ../patches/apply_skip_intro_diagnostic_v35.py
          python3 ../patches/apply_skip_intro_trace_v36.py
          python3 ../patches/apply_skip_intro_cache_v37.py
          python3 ../patches/apply_skip_intro_ea_header_v38.py
          python3 ../patches/apply_skip_intro_ea_trim_v39.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern v0.39 - Self-Consistent EA VP6 Skip Intro Preview

          WHY v0.39 EXISTS
          ----------------
          v0.38 proved that MVP's player does not tolerate reducing only the MVhd/SCHl
          declared durations while leaving the full original media stream behind. The
          game transitioned to a white screen and then exited/crashed.

          v0.39 therefore stops lying about a long stream's duration. It constructs a
          genuinely short EA Multimedia file from the user's own installed intro movie.
          The installed easports.vp6 and mvpintro.vp6 files remain untouched.

          HOW IT WORKS
          ------------
          For each startup movie, MVP2005 Modern copies the source into its private
          MVP2005Modern.IntroCache, validates every EA chunk boundary, and then builds a
          shorter cache from an exact prefix of the original chunk stream:

          - MVhd and SCHl/GSTR headers are retained.
          - Original MV0K/MV0F VP6 chunks are retained in their original order.
          - Original SCDl EA-ADPCM chunks are retained in their original order.
          - Enough real video frames and real audio samples are kept for about 120 ms.
          - The movie's own original SCEl end chunk is appended.
          - MVhd frame count is changed to the exact retained video-frame count.
          - SCHl total samples is changed to the exact retained SCDl sample count.
          - SCCl block count is corrected when present.
          - The cache file is physically truncated; no discarded media remains after SCEl.

          For revision-3 EA audio, SCDl duration is read from the same big-endian packet
          sample-count field used by FFmpeg's EA demuxer. Unknown/malformed layouts fail
          closed and MVP opens the original movie normally.

          TEST
          ----
          1. Replace MVP2005Modern.exe and mvp2005fix.dll with the v0.39 files.
          2. Delete MVP2005Modern.IntroCache once before the first v0.39 test.
          3. Keep Large Address Aware and other known-good settings as desired.
          4. Enable "Skip EA Sports / MVP intro videos".
          5. Launch MVP.
          6. Report whether both intros flash by and reach the main menu, remain visible,
             show a white screen, freeze, or crash.
          7. Send MVP2005Modern-Intro.log after the run.

          DIAGNOSTICS
          -----------
          The dedicated intro log records the first 40 original EA chunks, MVhd/SCHl
          metadata, target durations, original SCEl location, selected real video/audio
          counts, final cache size, calculated retained video/audio durations, redirect
          result, and explicit fallback whenever validation fails.

          SAFETY / REVERSIBILITY
          ----------------------
          The installed movie files are never modified. Unchecking Skip Intro restores
          normal movie access on the next launch. The IntroCache directory is disposable
          and is regenerated only from the user's own files.

          Existing SafeDiscShim, dgVoodoo, borderless, resolution, controller, setup,
          and Large Address Aware behavior is otherwise unchanged.
          EOF
          cat > dist/COMPONENTS.txt <<'EOF'
          MVP2005 Modern v0.39 component manifest
          upstream mvp2005fix: 1c0dae9b030a8fb66648655c8d14043af1ead676
          Controller baseline: v0.32
          Setup layer: v0.33
          Large Address Aware: v0.34
          Intro missing-file experiment: v0.35 (superseded; known to hang)
          Intro callsite trace: v0.36
          Intro format probe: v0.37 (established EA Multimedia container)
          Intro metadata-only duration experiment: v0.38 (superseded; white-screen/crash)
          Intro self-consistent EA VP6/ADPCM prefix trim: v0.39
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.39-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt COMPONENTS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.39-x86
          path: dist/
          if-no-files-found: error
