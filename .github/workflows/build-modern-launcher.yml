name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply_production_rc1.py'
      - 'patches/apply_skip_intro_runtime_v3.py'
      - 'patches/apply_modern_launcher_v1.py'
      - 'patches/apply_modern_launcher_v2.py'
      - 'patches/apply_modern_launcher_v3.py'
      - 'patches/apply_controller_configurator_v4.py'
      - 'patches/apply_controller_configurator_v5.py'
      - 'patches/apply_controller_configurator_v6.py'
      - 'patches/apply_controller_configurator_v7.py'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply RC1 runtime and Modern launcher
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v7.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern - All-in-One Launcher Preview v0.7

          Controller Setup v0.7
          ---------------------
          v0.7 fixes the controller.cfg button-number convention discovered from a
          real generated config and in-game behavior.

          DirectInput rgbButtons are zero-based, and MVP controller.cfg uses those
          same zero-based button indices. Earlier launcher previews learned the
          correct physical button but incorrectly wrote index+1.

          That one-position shift explains the observed symptoms exactly:
            - LB was learned as physical ID 5, but MVP used index 4, which the old
              config assigned to Y/pitch 4;
            - L3 was learned as ID 9, but MVP used index 8, which the old config
              assigned to Start/pause;
            - X was learned as ID 3, but MVP used index 2, which the old config
              assigned to B/Circle/back behavior.

          v0.7 now:
            - captures and stores zero-based MVP button indices;
            - allows button index 0 in the advanced fields;
            - shifts both Xbox and generic fallback presets to zero-based values;
            - shifts generic trigger-button fallback values as well;
            - labels the advanced values as MVP button indices instead of user-facing
              button numbers.

          Recommended flow:
            1. Open Controller Setup.
            2. Select your controller and Xbox-style layout.
            3. Calibrate / relearn all buttons again.
            4. Save to MVP.
            5. Test A/B/X/Y, LB/RB, Menu/Start and L3/R3 in game.

          Compatibility setup remains unchanged from the verified RC1 launcher path.
          Intro-video skipping remains disabled for now.
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.7-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.7-x86
          path: dist/
          if-no-files-found: error
