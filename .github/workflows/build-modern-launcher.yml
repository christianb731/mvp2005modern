name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply_production_rc1.py'
      - 'patches/apply_skip_intro_runtime_v3.py'
      - 'patches/apply_modern_launcher_v1.py'
      - 'patches/apply_modern_launcher_v2.py'
      - 'patches/apply_modern_launcher_v3.py'
      - 'patches/apply_controller_configurator_v4.py'
      - 'patches/apply_controller_configurator_v5.py'
      - 'patches/apply_controller_configurator_v6.py'
      - 'patches/apply_controller_configurator_v8.py'
      - 'patches/apply_controller_action_layout_v12.py'
      - 'patches/apply_controller_runtime_remap_v13.py'
      - 'patches/apply_controller_usability_v14.py'
      - 'patches/apply_controller_canonical_xbox_v15.py'
      - 'patches/apply_controller_xinput_bridge_v16.py'
      - 'patches/apply_controller_full_diagnostics_v17.py'
      - 'patches/apply_controller_frontend_gameplay_split_v18.py'
      - 'patches/apply_controller_x_quarantine_v19.py'
      - 'patches/apply_controller_zero_based_profile_v20.py'
      - 'patches/apply_controller_one_based_final_v21.py'
      - 'patches/apply_controller_buffered_input_v22.py'
      - 'patches/apply_controller_empirical_hybrid_v23.py'
      - 'patches/apply_controller_empirical_rb_v24.py'
      - 'patches/apply_controller_complete_gameplay_v25.py'
      - 'patches/apply_controller_back_r2_alias_v26.py'
      - 'patches/apply_controller_buttonized_modifiers_v27.py'
      - 'patches/apply_controller_back_manager_macro_v28.py'
      - 'patches/apply_controller_no_macro_cleanup_v29.py'
      - 'patches/apply_controller_lt_field_switch_v30.py'
      - 'patches/apply_controller_restore_native_fielding_v31.py'
      - 'patches/apply_controller_live_learning_v32.py'
      - 'patches/apply_setup_cleanup_v33.py'
      - 'patches/apply_setup_cleanup_v33_fix.py'
      - 'patches/apply_large_address_aware_v34.py'
      - 'patches/apply_large_address_aware_v34_fix.py'
      - 'patches/apply_skip_intro_diagnostic_v35.py'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply RC1 runtime and Modern launcher
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          python3 ../patches/apply_controller_usability_v14.py
          python3 ../patches/apply_controller_canonical_xbox_v15.py
          python3 ../patches/apply_controller_xinput_bridge_v16.py
          python3 ../patches/apply_controller_full_diagnostics_v17.py
          python3 ../patches/apply_controller_frontend_gameplay_split_v18.py
          python3 ../patches/apply_controller_x_quarantine_v19.py
          python3 ../patches/apply_controller_zero_based_profile_v20.py
          python3 ../patches/apply_controller_one_based_final_v21.py
          python3 ../patches/apply_controller_buffered_input_v22.py
          python3 ../patches/apply_controller_empirical_hybrid_v23.py
          python3 ../patches/apply_controller_empirical_rb_v24.py
          python3 ../patches/apply_controller_complete_gameplay_v25.py
          python3 ../patches/apply_controller_back_r2_alias_v26.py
          python3 ../patches/apply_controller_buttonized_modifiers_v27.py
          python3 ../patches/apply_controller_back_manager_macro_v28.py
          python3 ../patches/apply_controller_no_macro_cleanup_v29.py
          python3 ../patches/apply_controller_lt_field_switch_v30.py
          python3 ../patches/apply_controller_restore_native_fielding_v31.py
          python3 ../patches/apply_controller_live_learning_v32.py
          python3 ../patches/apply_setup_cleanup_v33.py
          python3 ../patches/apply_setup_cleanup_v33_fix.py
          python3 ../patches/apply_large_address_aware_v34.py
          python3 ../patches/apply_large_address_aware_v34_fix.py
          python3 ../patches/apply_skip_intro_diagnostic_v35.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern v0.35 - Diagnostic Skip Intro Preview

          QUICK START
          -----------
          1. Keep MVP2005Modern.exe and mvp2005fix.dll together in a normal writable
             folder such as Documents or a dedicated Games tools folder.
          2. Run MVP2005Modern.exe.
          3. Select/reuse your original mvp2005.exe.
          4. Leave the working v0.34 settings as desired, including Large Address Aware.
          5. Enable "Skip EA Sports / MVP intro videos" and launch the game.

          SKIP INTRO TEST
          ---------------
          This preview does NOT rename, replace, truncate, or delete any VP6 movie.
          The original easports.vp6 and mvpintro.vp6 files remain untouched.

          When Skip Intro is enabled, the injected runtime first records the result of
          the previously tested internal ENABLE_FRONTEND_MOVIES patch. It also watches
          the existing CreateFileA/CreateFileW runtime hooks. Exact attempts to open
          easports.vp6 or mvpintro.vp6 are logged and returned as ERROR_FILE_NOT_FOUND.
          The goal is to let MVP take its normal missing-optional-movie path instead of
          feeding the VP6 decoder an invalid/empty movie.

          A dedicated MVP2005Modern-Intro.log is created next to the launcher/runtime.
          It records:
          - whether the old internal movie-setting signature was found and patched;
          - each exact EA Sports/MVP intro VP6 open request;
          - whether the request used CreateFileA or CreateFileW;
          - access/share/disposition parameters;
          - the calling module and offset/RVA;
          - the explicit ERROR_FILE_NOT_FOUND interception.

          If the game still plays the intros, the log tells us that the movie path is
          bypassing these Win32 file opens. If the game reacts badly to a missing file,
          the caller offset gives us a much narrower place to inspect/patch next.

          LARGE ADDRESS AWARE
          -------------------
          The working v0.34 LAA implementation remains unchanged. It validates the PE32
          header, backs up mvp2005.exe once, toggles only IMAGE_FILE_LARGE_ADDRESS_AWARE,
          and records launcher/runtime verification in MVP2005Modern-LAA.log.

          CONTROLLER / COMPATIBILITY
          --------------------------
          Controller behavior remains frozen at the working v0.32 persistent learner.
          SafeDiscShim 0.9.0, dgVoodoo2 2.87.5, borderless behavior, resolution fixes,
          and the v0.33 permissions-aware Verify / Repair path are unchanged.
          Controller diagnostic logging remains OFF unless explicitly enabled with
          [ControllerDebug] Logging=1 in mvp2005fix.ini.

          SAFETY
          ------
          Unchecking Skip Intro restores normal movie access immediately on the next
          launch. No game assets are modified by this feature.
          EOF
          cat > dist/COMPONENTS.txt <<'EOF'
          MVP2005 Modern v0.35 component manifest

          upstream mvp2005fix commit:
          1c0dae9b030a8fb66648655c8d14043af1ead676

          SafeDiscShim v0.9.0 installer SHA-256:
          b4c355ec63047a09c20c286c083fcad1031d47a2c17eac0de12b96d377ec369f

          dgVoodoo2 v2.87.5 ZIP SHA-256:
          5ffde6927f7355ca3fdd5d785b581256a8e6539fa13e395a891ade6ba1040850

          Runtime baseline: MVP2005 Modern RC1 compatibility path
          Controller baseline: v0.32 persistent live learner / empirical mapping
          Setup layer: v0.33 permissions-aware Verify / Repair
          Executable option: v0.34 reversible Large Address Aware PE32 flag + diagnostics
          Intro experiment: v0.35 runtime missing-file interception + dedicated diagnostics
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.35-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt COMPONENTS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.35-x86
          path: dist/
          if-no-files-found: error
