name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern patch stack
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          python3 ../patches/apply_controller_usability_v14.py
          python3 ../patches/apply_controller_canonical_xbox_v15.py
          python3 ../patches/apply_controller_xinput_bridge_v16.py
          python3 ../patches/apply_controller_full_diagnostics_v17.py
          python3 ../patches/apply_controller_frontend_gameplay_split_v18.py
          python3 ../patches/apply_controller_x_quarantine_v19.py
          python3 ../patches/apply_controller_zero_based_profile_v20.py
          python3 ../patches/apply_controller_one_based_final_v21.py
          python3 ../patches/apply_controller_buffered_input_v22.py
          python3 ../patches/apply_controller_empirical_hybrid_v23.py
          python3 ../patches/apply_controller_empirical_rb_v24.py
          python3 ../patches/apply_controller_complete_gameplay_v25.py
          python3 ../patches/apply_controller_back_r2_alias_v26.py
          python3 ../patches/apply_controller_buttonized_modifiers_v27.py
          python3 ../patches/apply_controller_back_manager_macro_v28.py
          python3 ../patches/apply_controller_no_macro_cleanup_v29.py
          python3 ../patches/apply_controller_lt_field_switch_v30.py
          python3 ../patches/apply_controller_restore_native_fielding_v31.py
          python3 ../patches/apply_controller_live_learning_v32.py
          python3 ../patches/apply_setup_cleanup_v33.py
          python3 ../patches/apply_setup_cleanup_v33_fix.py
          python3 ../patches/apply_large_address_aware_v34.py
          python3 ../patches/apply_large_address_aware_v34_fix.py
          python3 ../patches/apply_skip_intro_diagnostic_v35.py
          python3 ../patches/apply_skip_intro_trace_v36.py
          python3 ../patches/apply_skip_intro_cache_v37.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern v0.37 - Safe Short-VP6 Skip Intro Preview

          WHAT CHANGED
          ------------
          v0.35 proved that pretending easports.vp6/mvpintro.vp6 are missing makes MVP
          retry forever. v0.36 then proved both startup movies travel through a generic
          worker-thread streaming path, making a code-level bypass too broad/risky.

          v0.37 uses a different method. Your installed intro movies remain untouched.
          When Skip Intro is enabled, the runtime copies each requested startup VP6 into
          MVP2005Modern.IntroCache beside the runtime, validates that the copy is a RIFF
          AVI with a VP60 video stream, shortens the copy's AVI duration metadata to
          approximately 120 ms, and redirects only easports.vp6 and mvpintro.vp6 to it.

          If validation, cache creation, header editing, or cache opening fails for any
          reason, MVP2005 Modern logs the failure and opens the original movie normally.
          It never substitutes an empty/missing file and never edits the original movie.

          TEST
          ----
          1. Replace MVP2005Modern.exe and mvp2005fix.dll with the v0.37 files.
          2. Keep the working Large Address Aware and other settings as desired.
          3. Enable "Skip EA Sports / MVP intro videos".
          4. Launch MVP.
          5. Report whether each intro is now nearly instantaneous, still full length,
             freezes, crashes, or behaves differently.
          6. Send MVP2005Modern-Intro.log after the test.

          DIAGNOSTICS
          -----------
          MVP2005Modern-Intro.log records:
          - the source and cache paths and copy byte count;
          - RIFF/AVI validation;
          - avih microseconds/frame, total frames, stream count, width and height;
          - each strh stream type, handler/FourCC, scale, rate, and old/new length;
          - OpenDML dmlh frame count when present;
          - VP60 validation and final cache-open result;
          - explicit fallback to the original whenever anything is not as expected.

          SAFETY / REVERSIBILITY
          ----------------------
          Unchecking Skip Intro disables the redirect on the next launch. The cache can
          also be deleted at any time; it is regenerated only from the user's installed
          source movies. No movie content is bundled with MVP2005 Modern.

          Existing SafeDiscShim, dgVoodoo, borderless, resolution, controller, setup,
          and Large Address Aware behavior is otherwise unchanged.
          EOF
          cat > dist/COMPONENTS.txt <<'EOF'
          MVP2005 Modern v0.37 component manifest
          upstream mvp2005fix: 1c0dae9b030a8fb66648655c8d14043af1ead676
          Controller baseline: v0.32
          Setup layer: v0.33
          Large Address Aware: v0.34
          Intro missing-file experiment: v0.35 (superseded; known to hang)
          Intro callsite trace: v0.36
          Intro safe short-VP6 RIFF/AVI cache redirect: v0.37
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.37-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt COMPONENTS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.37-x86
          path: dist/
          if-no-files-found: error
