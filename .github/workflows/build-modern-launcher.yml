name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply_production_rc1.py'
      - 'patches/apply_skip_intro_runtime_v3.py'
      - 'patches/apply_modern_launcher_v1.py'
      - 'patches/apply_modern_launcher_v2.py'
      - 'patches/apply_modern_launcher_v3.py'
      - 'patches/apply_controller_configurator_v4.py'
      - 'patches/apply_controller_configurator_v5.py'
      - 'patches/apply_controller_configurator_v6.py'
      - 'patches/apply_controller_configurator_v8.py'
      - 'patches/apply_controller_action_layout_v12.py'
      - 'patches/apply_controller_runtime_remap_v13.py'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply RC1 runtime and Modern launcher
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern - All-in-One Launcher Preview v0.13

          Runtime controller normalization
          --------------------------------
          The v0.10/v0.11 in-game traces established the missing detail:

            physical X     = DirectInput index 2
            physical LB    = DirectInput index 4
            physical Start = DirectInput index 7
            physical L3    = DirectInput index 8

          The observed gameplay behavior is exactly one position ahead of those
          physical indices when controller.cfg uses the conventional MVP values:

            X (DI2) behaves like controller.cfg button 2
            LB (DI4) behaves like controller.cfg button 4
            L3 (DI8) behaves like controller.cfg button 8 / Start

          That is why L3 really pauses the game, X behaves like B/Circle, and LB
          throws pitch 4. Changing baseball action assignments could never fix it.

          v0.13 therefore stops asking MVP's legacy parser to represent the modern
          controller directly. For Xbox-style controllers, Controller Setup now:

            1. Learns the real physical DirectInput indices.
            2. Saves those physical indices under [Controller] in mvp2005fix.ini.
            3. Writes controller.cfg as a stable logical MVP pad using buttons 1-10.
            4. The injected runtime shifts/remaps the 80-byte DIJOYSTATE button
               array before MVP consumes it, so logical button 1 really means A,
               button 3 really means X, button 8 really means Start, etc.

          This avoids depending on controller.cfg "button 0", which is not a safe
          assumption for MVP's old configuration parser, while still allowing
          arbitrary physical button ordering learned by calibration.

          Test procedure:
            1. Open Controller Setup.
            2. Xbox-style layout should be selected.
            3. Existing learned values are fine; recalibrate only if desired.
            4. Click Save to MVP once. This is important because it enables the
               runtime remap and stores the learned physical source indices.
            5. Launch the game and test X, LB, Start and L3 first.

          Expected result for the Flydigi trace:
            X behaves as X/pitch 3, not B/menu behavior.
            LB no longer throws pitch 4.
            Start pauses.
            L3 no longer pauses.

          Generic DirectInput mode continues to use direct controller.cfg bindings
          for now; the runtime normalizer is enabled only for Xbox-style mode.

          Compatibility setup remains unchanged from the verified RC1 launcher path.
          Intro-video skipping remains disabled for now.
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.13-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.13-x86
          path: dist/
          if-no-files-found: error
