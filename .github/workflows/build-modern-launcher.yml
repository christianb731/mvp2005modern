name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply_production_rc1.py'
      - 'patches/apply_skip_intro_runtime_v3.py'
      - 'patches/apply_modern_launcher_v1.py'
      - 'patches/apply_modern_launcher_v2.py'
      - 'patches/apply_modern_launcher_v3.py'
      - 'patches/apply_controller_configurator_v4.py'
      - 'patches/apply_controller_configurator_v5.py'
      - 'patches/apply_controller_configurator_v6.py'
      - 'patches/apply_controller_configurator_v8.py'
      - 'patches/apply_controller_action_layout_v12.py'
      - 'patches/apply_controller_runtime_remap_v13.py'
      - 'patches/apply_controller_usability_v14.py'
      - 'patches/apply_controller_canonical_xbox_v15.py'
      - 'patches/apply_controller_xinput_bridge_v16.py'
      - 'patches/apply_controller_full_diagnostics_v17.py'
      - 'patches/apply_controller_frontend_gameplay_split_v18.py'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply RC1 runtime and Modern launcher
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          python3 ../patches/apply_controller_usability_v14.py
          python3 ../patches/apply_controller_canonical_xbox_v15.py
          python3 ../patches/apply_controller_xinput_bridge_v16.py
          python3 ../patches/apply_controller_full_diagnostics_v17.py
          python3 ../patches/apply_controller_frontend_gameplay_split_v18.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern - Controller Fix + Diagnostics v0.18

          WHAT v0.17 PROVED
          -----------------
          The diagnostic run finally removed several unknowns:

            - MVP reads the expected Documents\MVP Baseball 2005\controller.cfg.
            - The profile in that file is the Flydigi Player 1 profile.
            - Ctrl+F8 / XINPUT_ZERO_BASED makes physical B become only DI slot 1,
              with no trigger, Esc, or Enter input, and B throws to first correctly.
            - In the same F8 mode, physical X becomes only DI slot 2, again with
              neutral triggers and no keyboard input, but MVP opens a menu.
            - controller.cfg maps button 2 to Throw First and button 3 to Throw
              Third, while it also maps VPAD_VIRTUAL_BUTTON_SQUARE to button 3.

          That means the remaining face-button problem is no longer an input API
          mystery. The same logical slot is being asked to serve two different MVP
          systems: frontend/menu virtual buttons and baseball gameplay actions.

          v0.18 SEPARATES THOSE TWO BANKS
          -------------------------------
          During gameplay:
            A/B/X/Y -> DI slots 0/1/2/3
            controller.cfg gameplay actions remain buttons 1/2/3/4

          During frontend/menu screens:
            A/B/X/Y -> DI slots 10/11/12/13
            VPAD_VIRTUAL_BUTTON_CROSS/CIRCLE/SQUARE/TRIANGLE are generated as
            buttons 11/12/13/14

          This uses the already-proven RC1 gameplay phase detector. It prevents X's
          gameplay Throw Third slot from simultaneously firing the virtual Square
          frontend command.

          v0.18 also fixes the reversed synthesized stick axes from v0.16 by using
          the sign convention demonstrated by v0.17's simultaneous raw DI/XInput
          trace.

          Diagnostics remain enabled. Ctrl+F4 toggles the face-bank split at
          runtime if you want an immediate A/B comparison without rebuilding.
          The older F5-F10 diagnostic modes are still present. v0.18 starts in the
          now-proven F8 / zero-based mode automatically.

          TEST
          ----
          1. Open Controller Setup once and click Save to MVP. Do not recalibrate.
             This rewrites the profile with the new separate frontend face bank.
          2. Launch the game normally.
          3. Verify menus can still be navigated with A/B/X/Y.
          4. In gameplay test:
               B = throw first
               X = throw third (must NOT open the menu)
               Y = throw second
               A = throw home
          5. Check left-stick directions.
          6. Then test LB/RB/L3/R3/LT/RT in their relevant contexts.

          If anything remains wrong, upload mvp2005controller_diagnostic.log. The
          full v0.17 instrumentation is intentionally still present, so another
          special diagnostic build should not be necessary.

          Compatibility/runtime behavior outside controller handling remains on the
          verified RC1 path. Intro-video skipping remains disabled.
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.18-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.18-x86
          path: dist/
          if-no-files-found: error
