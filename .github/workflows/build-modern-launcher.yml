name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern patch stack
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          python3 ../patches/apply_controller_usability_v14.py
          python3 ../patches/apply_controller_canonical_xbox_v15.py
          python3 ../patches/apply_controller_xinput_bridge_v16.py
          python3 ../patches/apply_controller_full_diagnostics_v17.py
          python3 ../patches/apply_controller_frontend_gameplay_split_v18.py
          python3 ../patches/apply_controller_x_quarantine_v19.py
          python3 ../patches/apply_controller_zero_based_profile_v20.py
          python3 ../patches/apply_controller_one_based_final_v21.py
          python3 ../patches/apply_controller_buffered_input_v22.py
          python3 ../patches/apply_controller_empirical_hybrid_v23.py
          python3 ../patches/apply_controller_empirical_rb_v24.py
          python3 ../patches/apply_controller_complete_gameplay_v25.py
          python3 ../patches/apply_controller_back_r2_alias_v26.py
          python3 ../patches/apply_controller_buttonized_modifiers_v27.py
          python3 ../patches/apply_controller_back_manager_macro_v28.py
          python3 ../patches/apply_controller_no_macro_cleanup_v29.py
          python3 ../patches/apply_controller_lt_field_switch_v30.py
          python3 ../patches/apply_controller_restore_native_fielding_v31.py
          python3 ../patches/apply_controller_live_learning_v32.py
          python3 ../patches/apply_setup_cleanup_v33.py
          python3 ../patches/apply_setup_cleanup_v33_fix.py
          python3 ../patches/apply_large_address_aware_v34.py
          python3 ../patches/apply_large_address_aware_v34_fix.py
          python3 ../patches/apply_skip_intro_diagnostic_v35.py
          python3 ../patches/apply_skip_intro_trace_v36.py
          python3 ../patches/apply_skip_intro_cache_v37.py
          python3 ../patches/apply_skip_intro_ea_header_v38.py
          python3 ../patches/apply_skip_intro_ea_trim_v39.py
          python3 ../patches/apply_skip_intro_sccl_v40.py
          python3 ../patches/apply_skip_intro_autoclick_v41.py
          python3 ../patches/apply_skip_intro_production_v42.py
          python3 ../patches/apply_menu_scale_probe_v43.py
          python3 ../patches/apply_menu_scale_safe_v44.py
          python3 ../patches/apply_menu_scale_aspect_v45.py
          python3 ../patches/apply_menu_scale_widescreen_v46.py
          python3 ../patches/apply_menu_scale_draw_probe_v47_bootstrap.py
          python3 ../patches/apply_menu_scale_native_v48.py
          python3 ../patches/apply_menu_scale_production_v49.py
          python3 ../patches/apply_gameplay_graphics_audit_v50_bootstrap.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package graphics audit preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern v0.50 - Gameplay Graphics Audit

          PURPOSE
          -------
          v0.50 is a passive diagnostics build on top of the v0.49 production baseline.
          It does NOT change texture sizes, filtering, render targets, viewports,
          shaders, antialiasing, LOD, or any other graphics behavior.

          It records enough of MVP's Direct3D 8 resource/state pipeline to decide which
          graphics improvements are actually worth pursuing rather than guessing.

          DEDICATED LOG
          -------------
          MVP2005Modern-Graphics.log

          The audit records:
          - CreateDevice / Reset presentation parameters and multisampling
          - texture creation: dimensions, mip levels, usage, format, pool, caller RVA
          - render-target, depth-stencil, and image-surface creation
          - CopyRects and UpdateTexture activity
          - render-target switches with known dimensions when available
          - viewport changes
          - selected render states
          - texture bindings correlated to known texture size/format
          - texture filtering, mip filtering, LOD bias, and anisotropy state changes
          - sampled gameplay draw calls with vertex/pixel shader and texture metadata
          - per-frame gameplay summaries

          SAFETY
          ------
          The audit wrappers only inspect arguments and metadata previously observed at
          resource creation. They deliberately perform no nested GetRenderTarget,
          GetBackBuffer, GetDesc, or other COM queries from hooked D3D calls.

          Diagnostic-hook failure does not change the normal production-hook success
          condition, so the audit cannot intentionally block launch merely because one
          optional graphics hook failed to install.

          TEST SEQUENCE
          -------------
          1. Replace MVP2005Modern.exe and mvp2005fix.dll with the v0.50 files.
          2. Launch normally and enter an actual game.
          3. Play at least one inning if practical. Include batting, pitching, and
             fielding so several cameras/render paths are exercised.
          4. Trigger a replay or between-play cutscene if convenient.
          5. Quit back to the frontend normally.
          6. Send MVP2005Modern-Graphics.log for analysis.

          A short gameplay sample is still useful. The purpose is to discover whether
          MVP exposes worthwhile fixed-resolution render targets, low filtering modes,
          texture limits, or identifiable resource paths before implementing anything.

          v0.49 remains the production baseline until this diagnostic build is tested.
          EOF
          cat > dist/COMPONENTS.txt <<'EOF'
          MVP2005 Modern v0.50 diagnostic component manifest
          upstream mvp2005fix: 1c0dae9b030a8fb66648655c8d14043af1ead676
          Production baseline: v0.49
          Controller behavior: v0.32 / setup hardening v0.33
          Large Address Aware: v0.34
          Skip Intro production: v0.42
          Frontend: native 800x600 production policy v0.49
          v0.50: passive gameplay graphics/resource/state audit only
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.50-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt COMPONENTS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.50-x86
          path: dist/
          if-no-files-found: error
