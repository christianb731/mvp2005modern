name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply_production_rc1.py'
      - 'patches/apply_skip_intro_runtime_v3.py'
      - 'patches/apply_modern_launcher_v1.py'
      - 'patches/apply_modern_launcher_v2.py'
      - 'patches/apply_modern_launcher_v3.py'
      - 'patches/apply_controller_configurator_v4.py'
      - 'patches/apply_controller_configurator_v5.py'
      - 'patches/apply_controller_configurator_v6.py'
      - 'patches/apply_controller_configurator_v8.py'
      - 'patches/apply_controller_action_layout_v12.py'
      - 'patches/apply_controller_runtime_remap_v13.py'
      - 'patches/apply_controller_usability_v14.py'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply RC1 runtime and Modern launcher
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          python3 ../patches/apply_controller_usability_v14.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern - All-in-One Launcher Preview v0.14

          Controller usability + trigger calibration
          ------------------------------------------
          v0.13 proved the runtime normalization fixed the one-position button
          mismatch: face buttons and Start now behave correctly on the Flydigi.

          v0.14 focuses on the controls that were still unhelpful or inactive:

            - Controller calibration now learns LT and RT as real DirectInput
              axes instead of assuming every modern pad uses axis 3.
            - Learned trigger bindings are saved in mvp2005fix.ini and reused.
            - The modern Xbox action defaults are made easier to understand/test:
                LB = fielder switch
                RB = pitch 5
                LT = advance all runners
                RT = relay/cutoff throw + retreat all runners
                L3 = pitch history + intentional hit batter
                R3 = bunt + intentional walk
                View = select + fake rundown throw
            - Face-button and Start runtime normalization from v0.13 remains.

          Test procedure:
            1. Open Controller Setup.
            2. Leave Xbox-style selected.
            3. Run "Calibrate buttons + triggers..." once.
            4. After the ten buttons, release both triggers and center both sticks.
            5. Follow the LT and RT prompts.
            6. Click Save to MVP.
            7. Test:
                pitching: RB = pitch 5 (when pitcher has one), L3 = pitch history
                batting: R3 = bunt
                fielding: LB = fielder switch, RT = relay/cutoff
                baserunning: LT = advance all, RT = retreat all

          These controls are context-sensitive by design, so a control can be
          inactive in a game state where its assigned baseball action does not apply.

          Compatibility setup remains unchanged from the verified RC1 launcher path.
          Intro-video skipping remains disabled for now.
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.14-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.14-x86
          path: dist/
          if-no-files-found: error
