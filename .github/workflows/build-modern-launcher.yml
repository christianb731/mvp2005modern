name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply_production_rc1.py'
      - 'patches/apply_skip_intro_runtime_v3.py'
      - 'patches/apply_modern_launcher_v1.py'
      - 'patches/apply_modern_launcher_v2.py'
      - 'patches/apply_modern_launcher_v3.py'
      - 'patches/apply_controller_configurator_v4.py'
      - 'patches/apply_controller_configurator_v5.py'
      - 'patches/apply_controller_configurator_v6.py'
      - 'patches/apply_controller_configurator_v7.py'
      - 'patches/apply_controller_configurator_v8.py'
      - 'patches/apply_controller_runtime_probe_v9.py'
      - 'patches/apply_controller_runtime_probe_v10.py'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply RC1 runtime and Modern launcher
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_runtime_probe_v9.py
          python3 ../patches/apply_controller_runtime_probe_v10.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern - All-in-One Launcher Preview v0.10

          Controller diagnostic build v10
          --------------------------------
          v0.9 successfully proved that MVP creates multiple DirectInput 7 joystick
          devices and applies an 80-byte / 44-object joystick data format, but the
          log contained no GetDeviceState button transitions.

          v0.10 extends the in-game probe rather than changing any mappings:
            - tracks up to 32 controller device instances instead of 8;
            - logs calls to GetDeviceState even when there is no button transition;
            - hooks legacy IDirectInputDevice::GetDeviceData (vtable slot 10);
            - decodes buffered DirectInput object events;
            - labels button offsets as DI[index] / MVP[one-based button] when MVP
              receives them.

          Test procedure:
            1. Launch MVP normally through MVP2005Modern.exe.
            2. Enter a menu or gameplay screen where the controller works.
            3. Press/release X, LB, Menu/Start, L3, then A, B, Y, RB and R3.
            4. Quit the game.
            5. Upload or paste mvp2005controller.log from the game directory.

          The useful lines will start with GetDeviceState, GetDeviceData,
          BUTTON EVENT or object event. This build does not alter controller.cfg.

          Compatibility setup remains unchanged from the verified RC1 launcher path.
          Intro-video skipping remains disabled for now.
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.10-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.10-x86
          path: dist/
          if-no-files-found: error
