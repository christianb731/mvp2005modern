name: Build MVP2005 Modern launcher

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-modern-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern patch stack
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          python3 ../patches/apply_skip_intro_runtime_v3.py
          python3 ../patches/apply_modern_launcher_v1.py
          python3 ../patches/apply_modern_launcher_v2.py
          python3 ../patches/apply_modern_launcher_v3.py
          python3 ../patches/apply_controller_configurator_v4.py
          python3 ../patches/apply_controller_configurator_v5.py
          python3 ../patches/apply_controller_configurator_v6.py
          python3 ../patches/apply_controller_configurator_v8.py
          python3 ../patches/apply_controller_action_layout_v12.py
          python3 ../patches/apply_controller_runtime_remap_v13.py
          python3 ../patches/apply_controller_usability_v14.py
          python3 ../patches/apply_controller_canonical_xbox_v15.py
          python3 ../patches/apply_controller_xinput_bridge_v16.py
          python3 ../patches/apply_controller_full_diagnostics_v17.py
          python3 ../patches/apply_controller_frontend_gameplay_split_v18.py
          python3 ../patches/apply_controller_x_quarantine_v19.py
          python3 ../patches/apply_controller_zero_based_profile_v20.py
          python3 ../patches/apply_controller_one_based_final_v21.py
          python3 ../patches/apply_controller_buffered_input_v22.py
          python3 ../patches/apply_controller_empirical_hybrid_v23.py
          python3 ../patches/apply_controller_empirical_rb_v24.py
          python3 ../patches/apply_controller_complete_gameplay_v25.py
          python3 ../patches/apply_controller_back_r2_alias_v26.py
          python3 ../patches/apply_controller_buttonized_modifiers_v27.py
          python3 ../patches/apply_controller_back_manager_macro_v28.py
          python3 ../patches/apply_controller_no_macro_cleanup_v29.py
          python3 ../patches/apply_controller_lt_field_switch_v30.py
          python3 ../patches/apply_controller_restore_native_fielding_v31.py
          python3 ../patches/apply_controller_live_learning_v32.py
          python3 ../patches/apply_setup_cleanup_v33.py
          python3 ../patches/apply_setup_cleanup_v33_fix.py
          python3 ../patches/apply_large_address_aware_v34.py
          python3 ../patches/apply_large_address_aware_v34_fix.py
          python3 ../patches/apply_skip_intro_diagnostic_v35.py
          python3 ../patches/apply_skip_intro_trace_v36.py
          python3 ../patches/apply_skip_intro_cache_v37.py
          python3 ../patches/apply_skip_intro_ea_header_v38.py
          python3 ../patches/apply_skip_intro_ea_trim_v39.py
          python3 ../patches/apply_skip_intro_sccl_v40.py
          python3 ../patches/apply_skip_intro_autoclick_v41.py
          python3 ../patches/apply_skip_intro_production_v42.py
          python3 ../patches/apply_menu_scale_probe_v43.py
          python3 ../patches/apply_menu_scale_safe_v44.py
          python3 ../patches/apply_menu_scale_aspect_v45.py
          python3 ../patches/apply_menu_scale_widescreen_v46.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 product
        run: make -C upstream release

      - name: Package launcher diagnostic preview
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/MVP2005Modern.exe
          cp upstream/release/mvp2005fix.dll dist/mvp2005fix.dll
          cp upstream/LICENSE dist/LICENSE
          cat > dist/SETUP.txt <<'EOF'
          MVP Baseball 2005 Modern v0.46 - Hybrid 16:9 Frontend Scaling

          WHAT v0.45 TAUGHT US
          --------------------
          v0.45 correctly created a centered 1920x1440 4:3 viewport at 2560x1440,
          and its mouse transform matched that viewport. The screenshot showed that
          several menu labels were clipped at the left viewport boundary, however.
          That means some frontend draws do not tolerate a non-zero D3D viewport
          origin even though the main background/panel geometry does.

          v0.46 therefore keeps the FRONTEND D3D viewport at the complete configured
          output, starting at 0,0, and performs aspect work in the verified 800x600
          orthographic matrix instead.

          HYBRID 16:9 EXPERIMENT
          ----------------------
          At 2560x1440, v0.46 classifies exact 800x600 frontend orthographic matrix
          submissions using the shader handle observed in the v0.44/v0.45 logs:

          UI_FIT (shader 0x00000005)
          - keeps the original 800x600 UI at correct proportions;
          - maps it to an effective centered 1920x1440 region;
          - does this through the projection matrix, not a clipped viewport.

          BACKGROUND_COVER (other 800x600 2D shaders)
          - fills the complete 2560x1440 output without horizontal stretching;
          - uniformly scales 800x600 to 2560x1920;
          - center-crops 240 physical pixels from the top and bottom (75 logical
            pixels each) to make a 4:3 source cover a 16:9 screen.

          This is intentionally a first empirical classification. The detailed log
          records the shader handle and exact before/after matrix for every early
          transformed layer so we can refine which layers are UI versus background.

          MOUSE
          -----
          The frontend mouse continues using the known 800x600 UI fit region because
          UI hit boxes remain in the original logical coordinate system. Gameplay
          keeps the existing raw-HD mouse path.

          DIAGNOSTICS
          -----------
          MVP2005Modern-MenuScale.log remains intentionally verbose. Look for:
          - HOOKS V46 ... full_viewport=1 ui_fit_matrix=1 background_cover=1
          - SETVIEWPORT ... out=0,0 2560x1440
          - WIDE MATRIX ... mode=UI_FIT shader=0x00000005
          - WIDE MATRIX ... mode=BACKGROUND_COVER shader=...
          - MOUSE FRONTEND ... viewport=320,0 1920x1440

          TEST SEQUENCE
          -------------
          1. Replace MVP2005Modern.exe and mvp2005fix.dll with the v0.46 files.
          2. Launch to the main menu.
          3. Check whether the previously clipped menu text is now completely visible.
          4. Check whether the background fills the 16:9 screen without looking wide.
          5. Check mouse alignment over multiple menu choices.
          6. If practical, enter gameplay and return to the frontend.
          7. Send MVP2005Modern-MenuScale.log and a screenshot.

          To disable only menu scaling while retaining diagnostics:

          [MenuScale]
          Enabled=0
          Diagnostics=1

          v0.42 Skip Intro and all other production behavior remain unchanged.
          EOF
          cat > dist/COMPONENTS.txt <<'EOF'
          MVP2005 Modern v0.46 diagnostic component manifest
          upstream mvp2005fix: 1c0dae9b030a8fb66648655c8d14043af1ead676
          Production baseline through Skip Intro: v0.42
          v0.43 broad D3D probe: superseded
          v0.44 full-HD frontend viewport proof
          v0.45 centered 4:3 viewport proof; exposed non-zero-origin UI clipping
          v0.46 full viewport + UI-fit/background-cover orthographic matrix experiment
          EOF
          (cd dist && zip -9 mvp2005modern-launcher-v0.46-x86.zip MVP2005Modern.exe mvp2005fix.dll LICENSE SETUP.txt COMPONENTS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-launcher-v0.46-x86
          path: dist/
          if-no-files-found: error
