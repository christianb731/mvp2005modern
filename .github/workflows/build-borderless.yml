name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          # v7 is diagnostic.  Do not scale GetCursorPos, window messages, or
          # DirectInput.  Keep only SetCursorPos suppression so the physical
          # cursor stays free, and trace the remaining Win32 input/geometry paths.
          python3 ../patches/apply_input_probe_v7.py
          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - Borderless Input Path Probe v7

          Replace the previous test mvp2005fix.exe and mvp2005fix.dll with this pair.

          Keep:
             [Borderless]
             Enabled=1

             [Debug]
             Logging=1

          Keep the known-good dgVoodoo.conf settings.

          v7 is intentionally diagnostic. Previous tests proved:
            - ScreenToClient scaling did not fix menu hit-testing.
            - Window-procedure mouse-message scaling did not fix it.
            - GetCursorPos scaling executed correctly but did not fix it.
            - DirectInput creates a relative system mouse, but the menu did not
              actually read mouse deltas through the instrumented state/data path.

          This build therefore stops transforming those coordinates. It only
          suppresses MVP's legacy SetCursorPos warps so the physical cursor stays
          free, then logs Win32 message-queue and geometry APIs that may feed the
          front-end before DispatchMessage.

          After launch, spend 10-15 seconds moving the mouse throughout the entire
          monitor, especially from inside the old 800x600 corner region to far
          outside it. Hover and click several menu controls.

          Useful lines include:
             borderless input probe installed hooks=.../10
             probe PeekMessageA msg=0200 ... lparam=... pt=...
             probe GetMessageA msg=0200 ... lparam=... pt=...
             probe GetMessagePos=...
             probe GetCursorPos raw=...
             probe ScreenToClient ... -> ...
             probe GetClientRect=... size=...
             probe GetWindowRect=... size=...
             probe GetSystemMetrics ...
             probe ClipCursor=...
             probe suppressed SetCursorPos ...

          Send the resulting mvp2005fix.log.
          EOF
          (cd dist && zip -9 mvp2005modern-borderless-input-probe-v7-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-borderless-input-probe-v7-x86
          path: dist/
          if-no-files-found: error
