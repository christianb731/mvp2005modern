name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          # v8 maps physical Win32 mouse messages into MVP's logical 800x600
          # front-end and is confirmed working in menus. v9-v11 retain the
          # borderless window guards. With dgVoodoo AppControlledScreenMode=false
          # the window now behaves non-exclusive, but gameplay mouse input remains
          # wrong. v12 recognizes the real 4:3 gameplay transition (1920x1440 on
          # a 2560x1440 monitor), resets diagnostics there, and stops applying the
          # menu coordinate transform during gameplay so raw client coordinates
          # reach MVP unchanged.
          python3 ../patches/apply_input_probe_v7.py
          python3 ../patches/apply_message_scale_v8.py
          python3 ../patches/apply_window_guard_v9.py
          python3 ../patches/apply_present_guard_v10.py
          python3 ../patches/apply_wndproc_geometry_guard_v11.py
          python3 ../patches/apply_gameplay_input_phase_v12.py
          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - Phase-Aware Gameplay Mouse Passthrough v12

          Replace the previous test mvp2005fix.exe and mvp2005fix.dll with this pair.

          Keep:
             [Borderless]
             Enabled=1

             [Debug]
             Logging=1

          For this test keep the dgVoodoo setting that produced non-exclusive
          gameplay behavior:

             [DirectX]
             AppControlledScreenMode = false

          Keep your other current dgVoodoo settings unchanged.

          v8 remains active in menus, where the physical 2560x1440 client must be
          mapped into MVP's logical 800x600 front-end coordinate space.

          The clean AppControlledScreenMode=false trace showed that the previous
          gameplay-phase detector fired too early during initial 640x480 startup.
          v12 detects only the characteristic 4:3 same-height gameplay request
          (1920x1440 on a 2560x1440 monitor) while MVP's logical backbuffer is
          800x600.

          At that exact transition v12:
            - marks gameplay mode,
            - resets bounded input/geometry/SetCursorPos diagnostics,
            - stops v8 mouse-coordinate scaling,
            - passes gameplay queued mouse messages to MVP unchanged.

          Useful log lines:
             gameplay 4:3 transition detected; mouse scaling disabled and diagnostics reset
             probe PeekMessageA raw msg=...
             PeekMessageA gameplay passthrough msg=...
             probe suppressed SetCursorPos ...
             probe GetCursorPos raw=...

          Test menus first to confirm they still work, then load fully into a game
          and test mouse input around all four corners and center. Send the resulting
          mvp2005fix.log if gameplay mouse input is still incorrect.
          EOF
          (cd dist && zip -9 mvp2005modern-borderless-gameplay-mouse-v12-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-borderless-gameplay-mouse-v12-x86
          path: dist/
          if-no-files-found: error
