name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern borderless runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          # apply_borderless.py intentionally builds several C helper blocks from
          # a raw Python string. Those blocks contain doubled backslashes in C
          # log literals. Teach the fail-safe patcher's exact-match helper to
          # retry with that representation when the normal form is not found.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    # The first borderless patch emits some helper blocks from a raw Python\n    # string, so C \\n sequences can contain one additional backslash.\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          # D3D8 requires a windowed swap chain to use the default presentation
          # interval. MVP's fullscreen request uses interval=1; carrying that
          # value into Windowed=TRUE produces D3DERR_INVALIDCALL (0x8876086C).
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - D3D8 Borderless Fail-Safe Test

          1. Back up the current mvp2005fix.exe and mvp2005fix.dll in the MVP Baseball 2005 folder.
          2. Copy this build's mvp2005fix.exe and mvp2005fix.dll beside mvp2005.exe.
          3. Keep the proven working dgVoodoo.conf values. Do not enable dgVoodoo fake/windowed borderless modes.
          4. In mvp2005fix.ini add:

             [Borderless]
             Enabled=1

          5. Keep [Debug] Logging=1 for the first run.
          6. Launch through mvp2005fix.exe.

          This build forces D3D8 windowed PresentationInterval to Default (0).
          If borderless CreateDevice still fails, it logs the HRESULT and retries
          immediately with MVP's original fullscreen parameters.

          Useful log entries:
             original CreateDevice ... interval=1
             borderless CreateDevice try ... interval=0
             borderless CreateDevice succeeded

          or, on failure:
             borderless CreateDevice failed hr=........; retrying original fullscreen parameters
             fullscreen CreateDevice fallback hr=........

          If MVP changes presentation state later, Reset has the same fallback behavior.
          EOF
          (cd dist && zip -9 mvp2005modern-borderless-failsafe-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-borderless-failsafe-x86
          path: dist/
          if-no-files-found: error
