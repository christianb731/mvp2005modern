name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          python3 ../patches/apply_mouse_scaling_v2.py
          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - Borderless + Mouse Scaling v2

          Replace the previous test mvp2005fix.exe and mvp2005fix.dll with this pair.

          Keep:
             [Borderless]
             Enabled=1

             [Debug]
             Logging=1

          Keep the known-good dgVoodoo.conf settings.

          This build scales only physical ScreenToClient input into MVP's logical
          back-buffer coordinates. ClientToScreen is intentionally left untouched
          so MVP can warp/recenter the Windows cursor without a scaling feedback loop.

          Expected startup log entries include:
             ScreenToClient one-way mouse scaling hook installed
             original CreateDevice ...
             borderless CreateDevice try ... interval=0
             borderless CreateDevice succeeded

          There should be no ClientToScreen mouse scaling hook in this build.
          EOF
          (cd dist && zip -9 mvp2005modern-borderless-mousefix-v2-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-borderless-mousefix-v2-x86
          path: dist/
          if-no-files-found: error
