name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          python3 ../patches/apply_input_probe_v7.py
          python3 ../patches/apply_message_scale_v8.py
          python3 ../patches/apply_window_guard_v9.py
          python3 ../patches/apply_present_guard_v10.py
          python3 ../patches/apply_wndproc_geometry_guard_v11.py
          python3 ../patches/apply_gameplay_input_phase_v12.py
          python3 ../patches/apply_alt_tab_probe_v14.py
          python3 ../patches/apply_true_borderless_v15.py
          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - True Borderless Gameplay + Alt-Tab v15

          This build targets the dgVoodoo configuration where gameplay is truly
          borderless immediately:

             [General]
             FullScreenMode = false

             [DirectX]
             AppControlledScreenMode = false

          Keep all other known-good dgVoodoo settings unchanged.

          Why v15 exists:
          - With FullScreenMode=false, MVP no longer emits the old 1920x1440
            gameplay resize. That meant the v12 detector never switched from the
            front-end 800x600 mouse scaler to raw gameplay input, producing the
            bottom-right-only mouse problem again.
          - v15 also treats the monitor-sized MoveWindow request immediately before
            gameplay as a gameplay-phase signal, while retaining the old 4:3 signal.
          - The v14 focus trace showed Present reasserting the window while Windows
            had intentionally minimized/deactivated it during Alt-Tab. v15 skips
            Present-time geometry enforcement while MVP is inactive/minimized/hidden.

          Test:
            1. Confirm menus work normally.
            2. Enter gameplay. Mouse should work across the whole game immediately.
            3. Alt-Tab out and back several times.
            4. Send mvp2005fix.log if either behavior is still wrong.

          Expected gameplay log line with FullScreenMode=false:
             gameplay monitor-sized MoveWindow detected; raw mouse passthrough enabled

          Expected during Alt-Tab: focus probe lines may show iconic=1, but there
          should be no Present borderless drift ... reasserting while iconic=1.
          EOF
          (cd dist && zip -9 mvp2005modern-true-borderless-v15-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-true-borderless-v15-x86
          path: dist/
          if-no-files-found: error
