name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          # v8 fixed front-end mouse input by scaling queued Win32 messages.
          # v9/v10 proved gameplay repeatedly collapses the actual HWND to
          # 1920x1440 even when SetWindowPos and Present reassert 2560x1440.
          # v11 subclasses the final D3D HWND and rewrites WM_WINDOWPOSCHANGING
          # / WM_STYLECHANGING after the previous WndProc returns, so Windows
          # commits our monitor-sized borderless geometry as the final value.
          python3 ../patches/apply_input_probe_v7.py
          python3 ../patches/apply_message_scale_v8.py
          python3 ../patches/apply_window_guard_v9.py
          python3 ../patches/apply_present_guard_v10.py
          python3 ../patches/apply_wndproc_geometry_guard_v11.py
          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - Final WndProc Borderless Geometry Guard v11

          Replace the previous test mvp2005fix.exe and mvp2005fix.dll with this pair.

          Keep:
             [Borderless]
             Enabled=1

             [Debug]
             Logging=1

          Keep the known-good dgVoodoo.conf settings.

          v8 remains the working front-end mouse fix: queued client mouse messages
          are mapped from the physical borderless client into MVP's logical 800x600
          front-end coordinate system.

          The v10 log proved that the gameplay transition is still able to leave
          the *actual* game HWND at 1920x1440 even after our SetWindowPos hook and
          per-Present guard request 2560x1440. That means the requested geometry is
          being modified later in the Win32 window-change path.

          v11 subclasses the final MVP D3D window. For WM_WINDOWPOSCHANGING and
          WM_STYLECHANGING it first lets MVP/dgVoodoo process the message, then
          overwrites the mutable structure immediately before Windows commits it.
          This makes the monitor-sized borderless rectangle the final value rather
          than merely another SetWindowPos request that can be rewritten afterward.

          Useful log lines:
             final borderless WndProc geometry guard installed
             WndProc guard WM_WINDOWPOSCHANGING ... -> 0,0 2560x1440
             WndProc guard WM_STYLECHANGING ...
             Present borderless drift ...

          Test menus, load fully into a game, and check whether the game remains
          2560x1440 borderless and whether the mouse remains aligned. Send the new
          mvp2005fix.log if anything is still wrong.
          EOF
          (cd dist && zip -9 mvp2005modern-borderless-wndproc-guard-v11-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-borderless-wndproc-guard-v11-x86
          path: dist/
          if-no-files-found: error
