name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          # v8 fixed front-end mouse input by scaling queued Win32 messages.
          # v9 proved the gameplay transition explicitly asks Windows for a
          # 1920x1440 4:3 window on the 2560x1440 monitor. Keep those guards and
          # v10 additionally verifies/reasserts the monitor-sized borderless HWND
          # at every D3D8 Present if any style/geometry path manages to drift it.
          # v10 also resets bounded input diagnostics at the first non-monitor
          # gameplay resize so we can see gameplay mouse coordinates in the log.
          python3 ../patches/apply_input_probe_v7.py
          python3 ../patches/apply_message_scale_v8.py
          python3 ../patches/apply_window_guard_v9.py
          python3 ../patches/apply_present_guard_v10.py
          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - Present-time Borderless Gameplay Guard v10

          Replace the previous test mvp2005fix.exe and mvp2005fix.dll with this pair.

          Keep:
             [Borderless]
             Enabled=1

             [Debug]
             Logging=1

          Keep the known-good dgVoodoo.conf settings.

          v8 fixed menu/front-end mouse input by mapping queued Win32 mouse
          messages from the physical 2560x1440 borderless client into MVP's
          logical 800x600 front-end coordinate system.

          The v9 log identified the gameplay transition precisely: MVP requests
          a 1920x1440 (4:3) SetWindowPos on a 2560x1440 monitor and changes the
          window style immediately before the 3D shader activity begins.

          v10 keeps all v8/v9 behavior and additionally hooks D3D8 Present (slot
          15). Before each Present it verifies that the game HWND still has the
          borderless popup style, monitor-sized window rectangle, and monitor-sized
          client area. Any drift is immediately reasserted before the frame is
          presented.

          v10 also detects the first non-monitor gameplay window-size request and
          resets the bounded input/message diagnostics, so the resulting log should
          contain gameplay mouse data instead of exhausting all logging in menus.

          Useful log lines:
             gameplay window-size transition detected; input diagnostics reset
             Present borderless drift window=... client=... style=...; reasserting
             PeekMessageA scaled msg=... client=2560x1440 logical=800x600
             window guard SetWindowPos request=0,0 1920x1440 logical=800x600

          Test menus, load fully into a game, move/click the mouse around the whole
          screen, and if anything is still wrong send the new mvp2005fix.log.
          EOF
          (cd dist && zip -9 mvp2005modern-borderless-present-guard-v10-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-borderless-present-guard-v10-x86
          path: dist/
          if-no-files-found: error
