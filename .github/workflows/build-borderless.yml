name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          # Keep the working free-cursor behavior. v6 additionally scales the
          # relative DirectInput mouse deltas that MVP uses for its internal
          # 800x600 menu cursor so physical monitor motion maps to that logical area.
          python3 ../patches/apply_mouse_getcursor_v4.py
          python3 ../patches/apply_directinput_scale_v6.py
          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - Borderless DirectInput Mouse Fix v6

          Replace the previous test mvp2005fix.exe and mvp2005fix.dll with this pair.

          Keep:
             [Borderless]
             Enabled=1

             [Debug]
             Logging=1

          Keep the known-good dgVoodoo.conf settings.

          The v5 probe confirmed MVP creates the system mouse through DirectInput 7
          with DIDF_RELAXIS (relative axes), a 16-byte mouse state, and
          NONEXCLUSIVE|FOREGROUND cooperative level.

          v6 scales those relative X/Y deltas from the physical borderless client
          size into MVP's current logical D3D8 backbuffer size. At 2560x1440 with
          an 800x600 logical menu, roughly 2560 physical pixels of horizontal mouse
          travel now accumulate to 800 logical pixels instead of hitting MVP's
          internal right edge after only ~800 physical pixels.

          Fractional remainders are preserved so slow/small mouse movements are not
          rounded away. Buttons and wheel input are left unchanged.

          Expected log entries:
             DirectInput relative mouse scaler installed
             DirectInput system mouse created
             DirectInput relative mouse scaling hooks installed
             DirectInput mouse format flags=00000002 relative=1 dataSize=16 numObjs=7
             DirectInput mouse delta ... -> ... client=2560x1440 logical=800x600

          Move the mouse across the entire monitor and test menu hover/click targets.
          EOF
          (cd dist && zip -9 mvp2005modern-borderless-directinput-mousefix-v6-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-borderless-directinput-mousefix-v6-x86
          path: dist/
          if-no-files-found: error
