name: Build MVP2005 Modern compatibility runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply consolidated MVP2005 Modern RC1 patch
        run: |
          cd upstream
          python3 ../patches/apply_production_rc1.py
          git diff --check
          git diff --stat

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package RC1 runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/RC1-README.txt <<'EOF'
          MVP Baseball 2005 Modern - Compatibility Runtime RC1

          This is the cleaned release-candidate build of the compatibility work
          validated through the v16 test series.

          Required mvp2005fix.ini setting:

             [Borderless]
             Enabled=1

          Known-good dgVoodoo settings:

             [General]
             FullScreenMode = false

             [DirectX]
             AppControlledScreenMode = false

          Keep the rest of the previously working dgVoodoo configuration unchanged.

          Validated behavior:
          - true borderless presentation from launch
          - widescreen/high-resolution rendering
          - correct frontend/menu mouse mapping
          - correct gameplay mouse mapping
          - repeated menu -> gameplay -> menu transitions
          - Alt-Tab without minimizing or pulling focus back
          - large-drive save fix inherited from mvp2005fix

          Production cleanup in RC1:
          - one canonical build entry point: patches/apply_production_rc1.py
          - development-era focus probe removed from the production build
          - seven diagnostic-only USER32 hooks are no longer installed
          - raw mouse/geometry trace spam removed
          - failure/fallback and limited phase/drift logging retained when Debug.Logging=1

          Resolution and Aspect.ScaleX remain user-configurable through
          mvp2005fix.ini exactly as before. For a 16:9 output, ScaleX is 0.75.

          No MVP Baseball 2005 game files are included.
          EOF
          (cd dist && zip -9 mvp2005modern-compatibility-rc1-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE RC1-README.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-compatibility-rc1-x86
          path: dist/
          if-no-files-found: error
