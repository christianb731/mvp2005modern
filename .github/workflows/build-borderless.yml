name: Build borderless runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-borderless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MVP2005 Modern
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 make git zip

      - name: Clone pinned upstream mvp2005fix
        run: |
          git clone https://github.com/ostrich/mvp2005fix.git upstream
          git -C upstream checkout 1c0dae9b030a8fb66648655c8d14043af1ead676

      - name: Apply MVP2005 Modern runtime changes
        run: |
          cd upstream
          python3 ../patches/apply_borderless.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('../patches/apply_failsafe.py')
          s = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, found {count}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n\n    alt_old = old.replace("\\\\n", "\\\\\\\\n")\n    alt_new = new.replace("\\\\n", "\\\\\\\\n")\n    alt_count = text.count(alt_old)\n    if alt_count == 1:\n        text = text.replace(alt_old, alt_new, 1)\n        return\n\n    raise SystemExit(f"{label}: expected exactly one match, found {count} (escaped form {alt_count})")\n'''
          if old not in s:
              raise SystemExit('could not update fail-safe replace_once helper')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 ../patches/apply_failsafe.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.c')
          s = p.read_text(encoding='utf-8')
          needle = '    pp->FullScreen_RefreshRateInHz = 0;\n'
          count = s.count(needle)
          if count < 2:
              raise SystemExit(f'expected at least 2 borderless refresh assignments, found {count}')
          replacement = needle + '    pp->FullScreen_PresentationInterval = 0;\n'
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          print(f'normalized D3D8 windowed presentation interval at {count} sites')
          PY

          # v8 fixed the front-end mouse by scaling queued Win32 mouse messages.
          # The gameplay transition does not Reset or recreate the D3D8 device,
          # so v9 additionally prevents MVP from shrinking/redecorating/moving the
          # already-borderless HWND when the 3D game scene starts.
          python3 ../patches/apply_input_probe_v7.py
          python3 ../patches/apply_message_scale_v8.py
          python3 ../patches/apply_window_guard_v9.py
          git diff -- src/runtime.c

      - name: Build upstream tests
        run: make -C upstream test-build

      - name: Build Windows x86 release
        run: make -C upstream release

      - name: Package test runtime
        run: |
          mkdir -p dist
          cp upstream/release/mvp2005fix.exe dist/
          cp upstream/release/mvp2005fix.dll dist/
          cp upstream/LICENSE dist/LICENSE
          cat > dist/TEST-INSTRUCTIONS.txt <<'EOF'
          MVP2005 Modern - Persistent Borderless Gameplay Guard v9

          Replace the previous test mvp2005fix.exe and mvp2005fix.dll with this pair.

          Keep:
             [Borderless]
             Enabled=1

             [Debug]
             Logging=1

          Keep the known-good dgVoodoo.conf settings.

          v8 successfully fixed the front-end/menu mouse by mapping queued Win32
          client mouse messages from the physical borderless client into MVP's
          logical 800x600 front-end coordinate system.

          The next test log showed that entering gameplay did NOT call D3D8 Reset
          and did NOT create a new D3D8 device. Instead, the same device continued
          directly into shader activity. That points to MVP changing the HWND's
          style/placement during the gameplay transition.

          v9 therefore keeps the v8 message scaling and adds a persistent guard on:
             SetWindowLongA
             SetWindowPos
             MoveWindow
             SetWindowPlacement

          Once MVP's D3D window is known, attempts to add borders, shrink it, or
          reposition it are forced back to the monitor-sized borderless rectangle.

          Useful log lines:
             borderless window guard installed hooks=4/4
             window guard SetWindowLongA ... requested=... forced=...
             window guard SetWindowPos request=...
             window guard MoveWindow request=...
             window guard SetWindowPlacement request=...

          Test the menus, then load all the way into an actual game. Verify:
            1. the menu mouse still works over the entire monitor;
            2. the game remains borderless after the 3D scene loads;
            3. mouse hit-testing is still aligned in gameplay.

          If anything changes at the gameplay transition, send the new log.
          EOF
          (cd dist && zip -9 mvp2005modern-borderless-gameplay-guard-v9-x86.zip mvp2005fix.exe mvp2005fix.dll LICENSE TEST-INSTRUCTIONS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvp2005modern-borderless-gameplay-guard-v9-x86
          path: dist/
          if-no-files-found: error
